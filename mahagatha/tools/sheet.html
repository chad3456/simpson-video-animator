<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#f3e6c8}</style></head><body>
<svg id="s" xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"></svg>
<script src="../engine/figures.js"></script>
<script>
const q=new URLSearchParams(location.search);
const F=PWFig; const svg=document.getElementById('s');
const defs=`<defs><radialGradient id="pwGlow"><stop offset="0" stop-color="#fff3b0" stop-opacity="1"/><stop offset="1" stop-color="#fff3b0" stop-opacity="0"/></radialGradient></defs>`;
const list=JSON.parse(q.get('list')||'[]'); // [[id, x, y, scale, state]]
let out=defs+'<rect width="1600" height="900" fill="#1f2b5e"/>';
for(const [id,x,y,sc,st,kind] of list){
  if(kind) out+=`<g transform="translate(${x} ${y}) scale(${sc})">${F.creature(kind,st||{})}</g>`;
  else out+=`<g transform="translate(${x} ${y}) scale(${sc})">${F.figure(F.CAST[id],Object.assign({t:1},st||{}))}</g>`;
}
svg.innerHTML=out; window.__ready=true;
</script></body></html>
