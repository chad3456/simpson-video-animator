<!doctype html>
<html><head><meta charset="utf-8"><title>Beautiful Idiot player</title>
<style>
@font-face { font-family: Bangers; src: url(../../trailer/fonts/Bangers-Regular.ttf); }
@font-face { font-family: Anton; src: url(../../trailer/fonts/Anton-Regular.ttf); }
@font-face { font-family: Abril; src: url(../../trailer/fonts/AbrilFatface-Regular.ttf); }
@font-face { font-family: RubikMono; src: url(../../trailer/fonts/RubikMonoOne-Regular.ttf); }
@font-face { font-family: Marker; src: url(../../trailer/fonts/PermanentMarker-Regular.ttf); }
html, body { margin: 0; background: #111; }
canvas { display: block; width: 1280px; height: 720px; }
</style></head>
<body>
<canvas id="c" width="1280" height="720"></canvas>
<script src="../../trailer/engine/core.js"></script>
<script src="../../trailer/engine/cast.js"></script>
<script src="episode.js"></script>
<script>
(async function () {
  const q = new URLSearchParams(location.search);
  const ep = q.get('ep');
  const ctx = document.getElementById('c').getContext('2d');
  const tl = await (await fetch(ep + '/timeline.json')).json();
  await Promise.all(['Bangers', 'Anton', 'Abril', 'RubikMono', 'Marker'].map(f => document.fonts.load(`40px ${f}`)));
  await document.fonts.load('700 27px Inter');
  window.Toon = { duration: tl.total, renderAt(t) { Episode.draw(ctx, tl, t); } };
  window.__ready = true;
  if (q.get('render') !== '1') {
    const audio = new Audio(ep + '/episode.wav'), start = Number(q.get('t') || 0);
    document.body.onclick = () => { audio.currentTime = start; audio.play(); };
    (function loop() { Toon.renderAt(audio.paused ? start : audio.currentTime); requestAnimationFrame(loop); })();
  }
})();
</script>
</body></html>
