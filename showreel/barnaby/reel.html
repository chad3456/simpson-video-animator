<!doctype html>
<html><head><meta charset="utf-8"><title>Barnaby showreel</title>
<style>
@font-face{font-family:Brico;src:url(fonts/BricolageGrotesque-Bold.ttf);font-weight:700}
@font-face{font-family:Brico;src:url(fonts/BricolageGrotesque-Regular.ttf);font-weight:400}
@font-face{font-family:Insta;src:url(fonts/InstrumentSans-Regular.ttf)}
@font-face{font-family:DMM;src:url(fonts/DMMono-Regular.ttf)}
html,body{margin:0;background:#111}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:#fff;transform-origin:0 0}
#stage *{box-sizing:border-box}
.bg{position:absolute;inset:0}
.type{position:absolute;font-family:Brico;font-weight:700;letter-spacing:-.035em;line-height:1.06}
.icw{display:inline-block;vertical-align:-.12em;transform-origin:50% 60%}
.ic{display:block}
.cur{display:inline-block;width:.07em;height:.85em;vertical-align:-.08em;margin-left:.04em}
.mono{position:absolute;font-family:DMM;white-space:nowrap}
.mascot{position:absolute;overflow:visible}
.ph{position:absolute;overflow:hidden;transform-origin:50% 50%}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.slot{background:repeating-linear-gradient(45deg,#2b2230 0 40px,#322838 40px 80px);display:flex;align-items:center;justify-content:center}
.slot span{font-family:DMM;color:#FFC21A;font-size:30px;border:2px dashed #FFC21A;padding:18px 28px;position:absolute;top:60px;left:60px}
.grid{position:absolute;inset:0;background-image:linear-gradient(#5FCB3C55 1px,transparent 1px),linear-gradient(90deg,#5FCB3C55 1px,transparent 1px);background-size:60px 60px}
.wm2{position:absolute;left:0;top:560px;width:1920px;text-align:center;font-family:Brico;font-weight:700;font-size:300px;letter-spacing:-.06em;color:#1F1420;line-height:1}
.panel{position:absolute;left:0;top:0;width:480px;height:1080px}
.canvas{position:absolute;left:520px;top:60px;width:1340px;height:680px;background:#fff;border:1px solid #ddd}
.plus{position:absolute;font-family:DMM;font-size:30px;color:#1F1420;transform:translate(-50%,-50%)}
.tools{position:absolute;left:520px;top:770px;width:1340px;height:270px;background:#fff;border:1px solid #ddd}
.sl{position:absolute;width:320px}
.sll{font-family:DMM;font-size:16px;color:#1F1420}
.slt{position:relative;height:4px;background:#ddd;margin-top:22px}
.slk{position:absolute;top:-10px;width:24px;height:24px;border-radius:50%;background:#FFC21A;border:3px solid #1F1420;transform:translateX(-50%)}
.sw{position:absolute;width:48px;height:48px;border-radius:8px}
.btn{position:absolute;left:1680px;top:912px;width:150px;height:64px;font-family:DMM;font-size:22px;color:#1F1420;display:flex;align-items:center;justify-content:center;border-radius:6px}
.pp{position:absolute;top:800px;font-family:DMM;font-size:15px;color:#cfc7cf;padding:8px 10px;border:1px solid #4a3f4b;border-radius:20px}
.huge{position:absolute;font-family:Brico;font-weight:700;font-size:820px;white-space:nowrap;letter-spacing:-.06em;line-height:1}
.anc{position:absolute;width:18px;height:18px;border:3px solid #FFC21A;transform:translate(-50%,-50%);background:#FF4A2E}
.spec{position:absolute;left:100px;top:120px;right:100px;bottom:60px;font-family:Brico;font-weight:700;text-align:center;letter-spacing:-.02em;overflow:hidden}
.stripe{position:absolute;top:0;height:1080px}
.sn{position:absolute;left:28px;bottom:120px;font-family:Brico;font-weight:700;font-size:50px;letter-spacing:-.03em}
.sh{position:absolute;left:30px;bottom:80px;font-family:DMM;font-size:22px}
.cell{position:absolute;width:124px;height:104px;border-radius:14px;display:flex;align-items:center;justify-content:center;border:2px solid #f1ece6}
.chip{display:inline-block;position:relative;width:130px;height:104px;border-radius:52px;overflow:hidden;vertical-align:-.15em}
</style></head>
<body><div id="stage"></div>
<script src="reel.js"></script>
<script>
(async () => {
  try { const r = await fetch('photos/credits.json'); if (r.ok) { const list = await r.json(); const m = {}; for (const p of list) m[p.key] = p; Reel.setPhotos(m); } } catch (e) {}
  const q = new URLSearchParams(location.search);
  await document.fonts.load('700 100px Brico'); await document.fonts.load('20px DMM'); await document.fonts.load('20px Insta');
  if (q.get('render')) { Reel.renderAt(0); window.__ready = true; return; }
  // preview mode: play in real time, scaled to the window
  const st = document.getElementById('stage');
  const fit = () => { st.style.transform = `scale(${Math.min(innerWidth / 1920, innerHeight / 1080)})`; }; fit(); addEventListener('resize', fit);
  const t0 = performance.now(); const loop = () => { Reel.renderAt(((performance.now() - t0) / 1000) % Reel.duration); requestAnimationFrame(loop); }; loop();
  window.__ready = true;
})();
</script></body></html>
