<!doctype html>
<!-- Mahabharata paint host: p5.js + p5.brush draw one layer per call.
     window.paint({shot, layer, t, seed, w, h}) -> {rgb, mask} as data URLs.
     rgb is painted on paper (or black for additive layers); mask is the recorded geometry, soft-edged. -->
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000;overflow:hidden}</style></head>
<body>
<script src="lib/p5.min.js"></script>
<script src="lib/p5.brush.js"></script>
<script src="kit.js"></script>
<script src="faces.js"></script>
<script src="shots.js"></script>
<script src="eps/test.js"></script>
<script src="eps/lib.js"></script>
<script src="eps/pieces.js"></script>
<script src="eps/season.js"></script>
<script>
const q = new URLSearchParams(location.search);
const W = +(q.get('w') || 1600), H = +(q.get('h') || 900);
let JOB = null, OUT = null;
const maskCv = document.createElement('canvas'); maskCv.width = W; maskCv.height = H;
const mctx = maskCv.getContext('2d');

function setup() {
  pixelDensity(1);
  createCanvas(W, H, WEBGL);
  setAttributes('preserveDrawingBuffer', true);
  angleMode(DEGREES);
  brush.load();
  brush.scaleBrushes(+(q.get('bs') || 1.6));
  noLoop();
  window.__ready = true;
}

function draw() {
  if (!JOB) return;
  const L = JOB.spec || SHOTS[JOB.shot].layers[JOB.layer];
  const mode = JOB.spec ? (L.b === 'add' ? 'add' : 'paint') : L.mode;
  translate(-W / 2, -H / 2);
  const bgc = L.bg || (mode === 'add' ? '#000000' : PAPER);
  background(bgc);
  P.begin(JOB.seed, W / 1600, mode);
  if (JOB.spec) drawSpec(P, L, JOB.t || 0, JOB); else L.draw(P, JOB.t || 0, JOB);
  brush.reDraw(); brush.reBlend();
  P.end();
}

window.paint = async (job) => {
  JOB = job; randomSeed(job.seed); noiseSeed(job.seed);
  mctx.setTransform(1, 0, 0, 1, 0, 0); mctx.fillStyle = '#000'; mctx.fillRect(0, 0, W, H);
  redraw();
  const rgb = document.querySelector('canvas').toDataURL(job.png ? 'image/png' : 'image/jpeg', 0.93);
  const mask = job.mask ? maskCv.toDataURL('image/png') : null;
  return { rgb, mask };
};
</script>
</body></html>
