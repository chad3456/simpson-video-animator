<!doctype html>
<html><head><meta charset="utf-8"><style>body{margin:0;background:#2a2440}</style></head>
<body>
<svg id="s" xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"></svg>
<script src="../engine/figures.js"></script>
<script>
  const q = new URLSearchParams(location.search);
  const ids = (q.get('ids') || 'shiva,vishnu,brahma5,narad,sati').split(',');
  const pose = q.get('pose');
  const { figure, creature, CAST } = CBFig;
  let out = `<defs><pattern id="cbDots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.3" fill="#000" opacity="0.45"/></pattern><radialGradient id="cbGlow"><stop offset="0" stop-color="#fff6c0" stop-opacity="0.9"/><stop offset="1" stop-color="#fff6c0" stop-opacity="0"/></radialGradient></defs><rect width="1600" height="900" fill="#f4ead2"/>`;
  const n = ids.length, s = +(q.get('s') || 1.25);
  ids.forEach((id, i) => {
    const o = CAST[id]; const x = (i + 0.5) * 1600 / n;
    const st = { t: 1, pose: pose || o.pose, emo: q.get('emo') || 'neutral', open: +(q.get('open') || 0), seat: q.get('seat') || undefined, turn: q.has('turn') ? +q.get('turn') : undefined };
    const body = o.creature ? creature(o.creature, st, {}) : figure(o, st);
    out += `<g transform="translate(${x} 840) scale(${s})">${body}</g><text x="${x}" y="890" font-size="20" text-anchor="middle" font-family="sans-serif">${id}</text>`;
  });
  document.getElementById('s').innerHTML = out;
  window.__ready = true;
</script></body></html>
