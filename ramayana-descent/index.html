<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>body{margin:0}</style></head><body>
<title>Ramayana Descent</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Tiro+Devanagari+Sanskrit&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: one fixed painted canvas world; story cards scroll over it like anime title cards, alternating sides. Single dark look by choice. */
:root {
  --ink: #0b0a1a;          /* night lacquer */
  --paper: #f6efe1;        /* card text */
  --muted: #b9b1c9;        /* secondary text */
  --gold: #f2c35b;         /* Ayodhya gold */
  --vermilion: #ff5a4e;    /* sindoor */
  --glass: rgba(14, 12, 32, .62);
  --line: rgba(242, 195, 91, .5);
  --f-display: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", Georgia, serif;
  --f-deva: "Tiro Devanagari Sanskrit", "Noto Serif Devanagari", "Kohinoor Devanagari", serif;
  --f-body: "Zen Kaku Gothic New", "Hiragino Sans", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  background: var(--ink); color: var(--paper);
  font-family: var(--f-body); font-size: 16px; line-height: 1.7;
  overflow-x: hidden;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--ink); }
#world { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100lvh; display: block; z-index: 0; touch-action: pan-y; }
.vignette { position: fixed; inset: 0; pointer-events: none; z-index: 1;
  background: radial-gradient(ellipse at center, transparent 55%, rgba(5,4,14,.55) 100%); }
main { position: relative; z-index: 2; pointer-events: none;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Hero */
.hero { min-height: 92vh; display: grid; place-items: center; text-align: center; padding-block: 12vh 8vh; }
.hero .kana { font-family: var(--f-display); font-weight: 800; letter-spacing: .35em; color: var(--gold); font-size: clamp(14px, 2.2vw, 20px); text-shadow: 0 0 18px rgba(242,195,91,.6); }
.hero h1 { margin: .1em 0 0; font-family: var(--f-deva); font-weight: 400; line-height: 1.05;
  font-size: clamp(72px, 17vw, 210px); color: var(--paper);
  text-shadow: 0 0 30px rgba(170,140,255,.55), 0 0 2px #fff, 4px 4px 0 rgba(255,90,78,.55); }
.hero .en { font-family: var(--f-display); font-weight: 800; letter-spacing: .5em; font-size: clamp(14px, 2.4vw, 22px); text-transform: uppercase; margin-top: .4em; padding-left: .5em; }
.hero p { max-width: 34ch; margin: 1.4em auto 0; color: var(--muted); text-wrap: balance; }
.scrollcue { margin-top: 2.4em; display: inline-flex; flex-direction: column; align-items: center; gap: 8px; font-size: 12px; letter-spacing: .3em; color: var(--gold); text-transform: uppercase; }
.scrollcue i { width: 1px; height: 54px; background: linear-gradient(var(--gold), transparent); animation: drip 2.2s ease-in-out infinite; transform-origin: top; }
@keyframes drip { 0% { transform: scaleY(.2); opacity: .2 } 50% { transform: scaleY(1); opacity: 1 } 100% { transform: scaleY(1) translateY(20px); opacity: 0 } }

/* Chapters */
.chapter { min-height: 175vh; display: flex; align-items: flex-start; padding-block: 22vh 0; }
.chapter:nth-of-type(even) { justify-content: flex-end; }
.card { pointer-events: auto; position: relative; width: min(440px, 100%); min-width: 0;
  background: var(--glass); backdrop-filter: blur(10px) saturate(1.2); -webkit-backdrop-filter: blur(10px) saturate(1.2);
  padding: 26px 26px 24px 26px; border-left: 3px solid var(--vermilion);
  clip-path: polygon(0 0, calc(100% - 22px) 0, 100% 22px, 100% 100%, 22px 100%, 0 calc(100% - 22px));
  opacity: .35; transform: translateY(24px); transition: opacity .7s ease, transform .7s cubic-bezier(.2,.8,.2,1); }
.card.on { opacity: 1; transform: none; }
.card .kanji { position: absolute; top: 14px; right: 18px; writing-mode: vertical-rl; font-family: var(--f-display); font-weight: 800;
  font-size: 44px; line-height: 1; color: transparent; -webkit-text-stroke: 1px var(--line); }
.eyebrow { font-size: 11px; letter-spacing: .28em; text-transform: uppercase; color: var(--gold); font-weight: 700; }
.card .deva { font-family: var(--f-deva); font-size: 40px; line-height: 1.15; margin-top: 6px; color: var(--paper); text-shadow: 3px 3px 0 rgba(255,90,78,.45); }
.card h2 { font-family: var(--f-display); font-weight: 800; font-size: 22px; line-height: 1.25; margin: 4px 0 12px; text-wrap: balance; padding-right: 48px; }
.card p { margin: 0 0 .8em; color: #e4dcef; font-size: 15px; }
.card .verse { font-family: var(--f-deva); color: var(--muted); font-size: 15px; border-top: 1px solid rgba(255,255,255,.12); padding-top: 10px; margin-top: 14px; }
.hint { display: inline-flex; align-items: center; gap: 8px; margin-top: 6px; font-size: 13px; font-weight: 700; color: var(--ink); background: var(--gold); padding: 5px 12px 5px 10px;
  clip-path: polygon(0 0, 100% 0, calc(100% - 8px) 100%, 0 100%); }
.hint b { font-family: var(--f-display); }
.stat { font-variant-numeric: tabular-nums; }

/* Finale */
.finale { min-height: 150vh; display: flex; align-items: flex-start; justify-content: center; text-align: center; padding-block: 30vh 20vh; }
.finale .card { text-align: left; }
.again { pointer-events: auto; font: 700 13px var(--f-body); letter-spacing: .2em; text-transform: uppercase; color: var(--paper); background: transparent; border: 1px solid var(--line); padding: 10px 18px; cursor: pointer; margin-top: 10px; }
.again:hover, .again:focus-visible { background: var(--vermilion); border-color: var(--vermilion); outline: none; }

/* HUD */
.rail { position: fixed; z-index: 5; left: max(10px, env(safe-area-inset-left, 0px)); top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 6px; }
.rail button { all: unset; cursor: pointer; display: flex; align-items: center; gap: 8px; font-family: var(--f-display); font-weight: 800; font-size: 13px; color: rgba(246,239,225,.4); padding: 2px 4px; }
.rail button::before { content: ""; width: 6px; height: 6px; border: 1px solid currentColor; transform: rotate(45deg); transition: all .3s; }
.rail button.cur { color: var(--gold); }
.rail button.cur::before { background: var(--gold); box-shadow: 0 0 10px var(--gold); width: 9px; height: 9px; }
.rail button:focus-visible { outline: 1px solid var(--gold); }
.rail span { opacity: 0; transition: opacity .3s; }
.rail:hover span, .rail button.cur span { opacity: 1; }
.depth { position: fixed; z-index: 5; right: max(14px, env(safe-area-inset-right, 0px)); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); text-align: right; font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); pointer-events: none; }
.depth b { display: block; font-family: var(--f-display); font-size: 26px; letter-spacing: 0; color: var(--paper); font-variant-numeric: tabular-nums; }
.sound { all: unset; position: fixed; z-index: 5; left: max(14px, env(safe-area-inset-left, 0px)); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); cursor: pointer;
  font: 700 11px var(--f-body); letter-spacing: .2em; text-transform: uppercase; color: var(--paper); border: 1px solid var(--line); padding: 8px 12px; background: rgba(11,10,26,.5); }
.sound:focus-visible { outline: 2px solid var(--gold); }
.sound[aria-pressed="true"] { background: var(--gold); color: var(--ink); }
@media (max-width: 640px) {
  .rail span { display: none; }
  .rail { left: 4px; }
  .chapter, .chapter:nth-of-type(even) { justify-content: center; padding-block: 48vh 0; }
  .card { padding: 20px 18px; }
  .card .deva { font-size: 32px; }
  .card .kanji { font-size: 34px; }
  .depth b { font-size: 20px; }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  .card { transition: none; }
  .scrollcue i { animation: none; }
}
</style>

<canvas id="world" aria-hidden="true"></canvas>
<div class="vignette"></div>

<nav class="rail" aria-label="Chapters" id="rail"></nav>
<button class="sound" id="sound" aria-pressed="false">Tanpura off</button>
<div class="depth" aria-live="off"><b id="depthNum">0</b>yojanas descended</div>

<main id="main">
  <header class="hero" id="top">
    <div>
      <div class="kana">ラーマーヤナ · 降下</div>
      <h1>रामायण</h1>
      <div class="en">The Descent</div>
      <p>Fall from the ocean of milk to the lamps of Ayodhya, through nine painted worlds. Some of them answer when you touch them.</p>
      <div class="scrollcue">Scroll to descend<i></i></div>
    </div>
  </header>
</main>

<script>
(() => {
"use strict";
// ---------- Story ----------
const CH = [
  { k:"乳海", kana:"ニュウカイ", eb:"Prologue", deva:"क्षीरसागर", en:"The Ocean of Milk",
    body:["Before there is a story there is an ocean. Vishnu sleeps on the coils of the serpent Shesha, and the earth comes to him weeping about a king with ten heads.",
          "No god can kill Ravana; he asked only gods for protection. So Vishnu agrees to be born as a man."],
    verse:"रामो विग्रहवान् धर्मः · Rama is dharma in a body" },
  { k:"暁", kana:"アヨーディヤー", eb:"Bala Kanda", deva:"अयोध्या", en:"Dawn over Ayodhya",
    body:["On the banks of the Sarayu, King Dasharatha's three queens give birth to four sons. Kausalya's son, Rama, is the eldest.",
          "The city that cannot be conquered (that is what Ayodhya means) wakes up gold."] },
  { k:"弓", kana:"ピナーカ", eb:"Bala Kanda", deva:"शिवधनुष", en:"The Bow of Shiva",
    body:["In Mithila, King Janaka sets a test: whoever can string Pinaka, the bow of Shiva, may marry his daughter Sita.",
          "Princes fail to lift it. Rama lifts it, bends it, and it breaks with a sound like the sky cracking."],
    hint:"Keep scrolling to break the bow" },
  { k:"森", kana:"パンチャヴァティー", eb:"Aranya Kanda", deva:"वनवास", en:"Fourteen Years of Forest",
    body:["Queen Kaikeyi calls in two old boons: her son Bharata will rule, and Rama will live fourteen years in the forest. Sita and Lakshmana go with him.",
          "At Panchavati a golden deer appears. It is the demon Maricha in disguise, sent to draw Rama away."],
    hint:"Move your pointer. The deer will follow it" },
  { k:"攫", kana:"プシュパカ", eb:"Aranya Kanda", deva:"सीताहरण", en:"The Abduction",
    body:["With both brothers gone, Ravana takes Sita into his flying chariot, the Pushpaka.",
          "The old vulture-king Jatayu fights him in the air and falls. Sita drops her jewels one by one, a trail for Rama to find."] },
  { k:"跳", kana:"ハヌマーン", eb:"Sundara Kanda", deva:"हनुमान", en:"A Hundred Yojanas",
    body:["Hanuman, son of the wind, grows as large as a mountain and leaps across the sea to Lanka: a hundred yojanas in one jump.",
          "He finds Sita under an ashoka tree and gives her Rama's ring so she knows he is coming."],
    hint:"Scroll faster. The wind follows you" },
  { k:"橋", kana:"ラーマ・セートゥ", eb:"Yuddha Kanda", deva:"रामसेतु", en:"Stones That Float",
    body:["The vanara army has no ships. Nala and Nila write Rama's name on rocks, and the rocks float.",
          "Even a squirrel helps, rolling in sand and shaking it onto the bridge."],
    hint:"Tap the sea to drop a stone", stat:"stones" },
  { k:"戦", kana:"ラーヴァナ", eb:"Yuddha Kanda", deva:"रावणवध", en:"Ten Heads",
    body:["Lanka burns. Every head Rama cuts from Ravana grows back.",
          "Vibhishana tells him the secret: the nectar of immortality is stored in Ravana's navel. Rama draws the Brahmastra."],
    hint:"Press and hold to draw the bow, then let go" },
  { k:"灯", kana:"ディーパーヴァリ", eb:"Yuddha Kanda", deva:"दीपावली", en:"The Return",
    body:["Fourteen years end. The Pushpaka carries Rama, Sita and Lakshmana home on a new-moon night.",
          "Ayodhya cannot see the sky road, so it lights a lamp in every window. People still do. That night is Diwali."],
    hint:"Tap the lamps to light them", stat:"lamps" },
];
const N = CH.length;

// ---------- DOM ----------
const main = document.getElementById("main");
const rail = document.getElementById("rail");
const cards = [];
CH.forEach((c, i) => {
  const s = document.createElement("section");
  s.className = "chapter"; s.id = "ch" + i;
  s.innerHTML = `<article class="card">
    <div class="kanji" aria-hidden="true">${c.k}</div>
    <div class="eyebrow">${c.eb} · ${c.kana}</div>
    <div class="deva" lang="sa">${c.deva}</div>
    <h2>${c.en}</h2>
    ${c.body.map(p => `<p>${p}</p>`).join("")}
    ${c.hint ? `<div class="hint"><b>▶</b>${c.hint}${c.stat ? ` · <span class="stat" id="stat-${c.stat}">0</span>` : ""}</div>` : ""}
    ${c.verse ? `<div class="verse">${c.verse}</div>` : ""}
  </article>`;
  main.appendChild(s);
  cards.push(s.querySelector(".card"));
  const b = document.createElement("button");
  b.innerHTML = `<span>${c.k}</span>`; b.setAttribute("aria-label", c.en);
  b.onclick = () => s.scrollIntoView({ behavior: reduce ? "auto" : "smooth" });
  rail.appendChild(b);
});
const fin = document.createElement("section");
fin.className = "finale";
fin.innerHTML = `<article class="card on"><div class="kanji" aria-hidden="true">終</div>
  <div class="eyebrow">Iti · おわり</div><div class="deva">जय श्री राम</div>
  <h2>The lamps stay lit</h2>
  <p>Valmiki's Ramayana runs to about 24,000 verses in seven books. This was nine moments from it, falling one into the next.</p>
  <button class="again" id="again">Rise to the ocean again</button></article>`;
main.appendChild(fin);
const railBtns = [...rail.children];

const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

// ---------- Canvas ----------
const cv = document.getElementById("world");
const ctx = cv.getContext("2d");
let W = 0, H = 0, U = 0, DPR = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 1.75);
  W = innerWidth; H = innerHeight; U = Math.min(W, H);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
addEventListener("resize", resize); resize();

// seeded random
let seed = 7;
const R = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const ss = (a, b, v) => { const t = clamp((v - a) / (b - a)); return t * t * (3 - 2 * t); };
const TAU = Math.PI * 2;

const stars = Array.from({ length: 260 }, () => ({ x: R(), y: R(), r: R() * 1.4 + .2, p: R() * TAU }));
const skyline = (() => { seed = 11; const a = []; let x = -.05;
  while (x < 1.1) { const w = .03 + R() * .06; a.push({ x, w, h: .06 + R() * .16, t: Math.floor(R() * 3), f: R() < .4 }); x += w * (.8 + R() * .3); } return a; })();
const skyline2 = (() => { seed = 19; const a = []; let x = -.05;
  while (x < 1.1) { const w = .05 + R() * .08; a.push({ x, w, h: .04 + R() * .09, t: Math.floor(R() * 3), f: false }); x += w * .9; } return a; })();
const trees = (() => { seed = 23; return [0, 1, 2].map(layer => Array.from({ length: 9 + layer * 3 }, (_, i) => ({ x: i / (8 + layer * 3) + (R() - .5) * .06, h: .35 + R() * .3 - layer * .06, r: .06 + R() * .05 - layer * .012 }))); })();
const flies = Array.from({ length: 50 }, () => ({ x: R(), y: .3 + R() * .6, p: R() * TAU, s: .5 + R() }));
const birds = Array.from({ length: 14 }, () => ({ x: R() * .4, y: R() * .2, p: R() * TAU }));

// ---------- Drawing helpers ----------
function sky(stops) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  stops.forEach(([o, c]) => g.addColorStop(o, c));
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}
function glow(x, y, r, c, a = 1) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, c); g.addColorStop(1, "rgba(0,0,0,0)");
  ctx.globalAlpha = a; ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); ctx.globalAlpha = 1;
}
function disc(x, y, r, c) { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); }
// two-tone cel cloud: shadow mass, then lit mass offset up, hard edge
function cloud(x, y, s, lit, shade) {
  const puffs = [[-1.1, .15, .55], [-.5, -.15, .75], [.2, -.3, .9], [.9, -.05, .65], [1.4, .2, .45], [0, .25, .7]];
  ctx.fillStyle = shade; ctx.beginPath();
  puffs.forEach(([px, py, pr]) => { ctx.moveTo(x + px * s + pr * s, y + py * s); ctx.arc(x + px * s, y + py * s, pr * s, 0, TAU); });
  ctx.fill();
  ctx.fillStyle = lit; ctx.beginPath();
  puffs.forEach(([px, py, pr]) => { if (py < .2) { ctx.moveTo(x + px * s - .08 * s + pr * .8 * s, y + py * s - .12 * s); ctx.arc(x + px * s - .08 * s, y + py * s - .12 * s, pr * .8 * s, 0, TAU); } });
  ctx.fill();
}
function starfield(a, t) {
  ctx.fillStyle = "#fff";
  for (const s of stars) {
    ctx.globalAlpha = a * (.4 + .6 * Math.abs(Math.sin(t * .8 + s.p)));
    ctx.fillRect(s.x * W, s.y * H, s.r, s.r);
  }
  ctx.globalAlpha = 1;
}
function rays(x, y, n, len, c, a, rot) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.globalAlpha = a; ctx.fillStyle = c;
  for (let i = 0; i < n; i++) { ctx.rotate(TAU / n); ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(len, -len * .04); ctx.lineTo(len, len * .04); ctx.fill(); }
  ctx.restore(); ctx.globalAlpha = 1;
}
function speedLines(amt, cx, cy, c = "#fff") {
  if (amt < .02 || reduce) return;
  ctx.save(); ctx.strokeStyle = c; ctx.lineCap = "round";
  const n = Math.floor(30 + amt * 70), D = Math.hypot(W, H);
  for (let i = 0; i < n; i++) {
    const a = Math.random() * TAU, r0 = D * (.28 + Math.random() * .25 * (1 - amt * .5));
    ctx.globalAlpha = .15 + Math.random() * .5 * amt; ctx.lineWidth = 1 + Math.random() * 3 * amt;
    ctx.beginPath(); ctx.moveTo(cx + Math.cos(a) * r0, cy + Math.sin(a) * r0); ctx.lineTo(cx + Math.cos(a) * D, cy + Math.sin(a) * D); ctx.stroke();
  }
  ctx.restore();
}
function water(y0, c1, c2, t, glint) {
  const g = ctx.createLinearGradient(0, y0, 0, H); g.addColorStop(0, c1); g.addColorStop(1, c2);
  ctx.fillStyle = g; ctx.fillRect(0, y0, W, H - y0);
  ctx.strokeStyle = glint; ctx.lineWidth = 1.2;
  for (let i = 0; i < 26; i++) {
    const yy = y0 + Math.pow(i / 26, 1.6) * (H - y0) + 4;
    const w = 20 + i * 5, off = (t * (8 + i) + i * 97) % (W + w);
    ctx.globalAlpha = .25 + (i / 26) * .35;
    for (let x = -w + off % (w * 3); x < W; x += w * 3) { ctx.beginPath(); ctx.moveTo(x, yy); ctx.lineTo(x + w, yy); ctx.stroke(); }
  }
  ctx.globalAlpha = 1;
}
function crown(x, y, s) { ctx.beginPath(); ctx.moveTo(x - s, y); ctx.lineTo(x - s * .7, y - s * 1.3); ctx.lineTo(x - s * .3, y - s * .6); ctx.lineTo(x, y - s * 1.9); ctx.lineTo(x + s * .3, y - s * .6); ctx.lineTo(x + s * .7, y - s * 1.3); ctx.lineTo(x + s, y); ctx.closePath(); ctx.fill(); }

// Rama: backlit archer silhouette, unit height 2
function archer(x, y, s, pull, fill, rim) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.shadowColor = rim; ctx.shadowBlur = 18; ctx.fillStyle = fill; ctx.strokeStyle = fill; ctx.lineCap = "round"; ctx.lineJoin = "round";
  // quiver
  ctx.save(); ctx.translate(-.14, -1.45); ctx.rotate(-.5); ctx.fillRect(-.05, -.25, .1, .55); ctx.restore();
  // legs
  ctx.lineWidth = .13; ctx.beginPath(); ctx.moveTo(-.04, -.95); ctx.lineTo(-.32, 0); ctx.moveTo(.04, -.95); ctx.lineTo(.3, -.02); ctx.stroke();
  // dhoti
  ctx.beginPath(); ctx.moveTo(-.13, -1.05); ctx.lineTo(.13, -1.05); ctx.lineTo(.3, -.5); ctx.quadraticCurveTo(0, -.42, -.3, -.5); ctx.closePath(); ctx.fill();
  // torso
  ctx.beginPath(); ctx.moveTo(-.2, -1.58); ctx.lineTo(.2, -1.58); ctx.lineTo(.13, -1.02); ctx.lineTo(-.13, -1.02); ctx.closePath(); ctx.fill();
  // sash streaming
  ctx.lineWidth = .04; ctx.beginPath(); ctx.moveTo(-.1, -1.5); ctx.quadraticCurveTo(-.5, -1.4 + Math.sin(T * 3) * .05, -.7, -1.25 + Math.sin(T * 3 + 1) * .08); ctx.stroke();
  // head + mukut
  ctx.beginPath(); ctx.arc(0, -1.74, .13, 0, TAU); ctx.fill(); crown(0, -1.84, .1);
  // hair
  ctx.beginPath(); ctx.moveTo(-.1, -1.78); ctx.quadraticCurveTo(-.3, -1.6, -.22, -1.42); ctx.lineTo(-.08, -1.66); ctx.fill();
  // bow
  const bx = .35, by = -1.42, br = .58 + pull * .02, ba = 1.1 - pull * .12;
